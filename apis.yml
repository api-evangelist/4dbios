aid: 4dbios
name: 4D Bios
description: >-
  4D Bios Co., Ltd. (四维生态, Hangzhou, China) is an ag-tech manufacturer of smart vertical-farming
  systems, founded in 2018 by Dr. Gary Hua. It designs and builds fully enclosed, digitally
  controlled plant factories — 3D, nursery, strawberry, leafy-greens and specialty lines — alongside
  containerized grow systems, indoor grow boxes, full-control planting equipment and LED
  horticultural lighting. The hardware is operated from the company's own software layer: the 4D
  Cloud Platform, the 4D CUBE MS management console and 4D BOX, which combine IoT telemetry,
  environmental and HVAC control, nutrient-solution circulation and big-data analytics for
  year-round continuous production. 4D Bios markets a "4D Bios Open Platform API" for customers who
  have already purchased its products and want to build their own software or hardware against the
  platform, and invites third-party platform service providers to develop applications on the Open
  Platform. That API has no public developer portal, reference, or machine-readable contract; the
  Open Platform and IoT consoles are login-gated single-page applications.
